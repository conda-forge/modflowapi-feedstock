{% set name = "modflowapi" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/modflowapi-{{ version }}.tar.gz
  sha256: 7e2bf2491673a68ce3532ee07530c01fcfb84b8e5673ac8142307e5e4174969a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
    - numpy
    - xmipy
    - pandas
  run:
    - python >={{ python_min }}
    - numpy
    - xmipy
    - pandas

test:
  imports:
    - modflowapi
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/MODFLOW-USGS/modflowapi.git
  summary: modflowapi is an extension to the xmipy Python package.
  license: CC0-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jdhughes-dev
    - jlarsen-usgs
    - wpbonelli
