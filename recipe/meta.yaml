{% set name = "modflowapi" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/modflowapi-{{ version }}.tar.gz
  sha256: 1388d47f706115fee537a721e91700a3c9ad7b6e2a41b2f85f07cefe5f9d558e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.23
    - pandas >=1.5
    - xmipy >=1.5.0

test:
  imports:
    - modflowapi
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/MODFLOW-ORG/modflowapi
  summary: modflowapi is an extension to the xmipy Python package.
  license: CC0-1.0
  license_file: LICENSE
  dev_url: https://github.com/MODFLOW-ORG/modflowapi

extra:
  recipe-maintainers:
    - jdhughes-dev
    - jlarsen-usgs
    - wpbonelli
